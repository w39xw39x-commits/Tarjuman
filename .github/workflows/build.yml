name: Build & publish

on:
  push:
    branches: [ main ]
    paths-ignore: [ "site/**" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: >
          gradle :app:assembleRelease --no-daemon
          -PGROQ_KEY="${{ secrets.GROQ_API_KEY }}"
          -PBUILD_NUMBER=$((100 + ${{ github.run_number }}))

      - name: Put APK + version.json into site/
        run: |
          CODE=$((100 + ${{ github.run_number }}))
          BASE=$(grep '^UPDATE_BASE=' gradle.properties | cut -d= -f2-)
          cp app/build/outputs/apk/release/app-release.apk site/Tarjuman.apk
          python3 - "$CODE" "$BASE" <<'PY'
          import json, sys
          code, base = int(sys.argv[1]), sys.argv[2]
          notes = [l.strip() for l in open("CHANGES.txt", encoding="utf-8") if l.strip()][:4]
          json.dump({"versionCode": code, "versionName": f"1.0.{code}",
                     "apk": f"{base}/Tarjuman.apk", "notes": notes},
                    open("site/version.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          PY
          ls -la site

      - name: Commit site (Netlify publishes it)
        run: |
          git config user.name "tarjuman-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site
          git commit -m "Release $((100 + ${{ github.run_number }}))" || echo "nothing to commit"
          git push
